# ──────────────────────────────────────────────────────────────────────
# RealTraffic — FULL home-PC stack (frontend + backend + DB + SSL + DDNS)
# 100 % on your PC. Vercel / Cloudflare / any external service — NONE.
# Only DuckDNS (a free DNS pointer) so bahir se access ho sake.
# ──────────────────────────────────────────────────────────────────────
# Architecture:
#     [Browser anywhere]
#            │ https://yourname.duckdns.org
#            ▼
#     [realtraffic-caddy  :80 / :443  auto-SSL + rate-limit]
#            │
#            ├─ /api/* , /health , /ws/* , /r/* , /t/*  →  [backend:8001]
#            └─ /*  (everything else)                    →  [frontend:80]
#                                                                │
#                                                    [nginx serves React build]
#
#     [realtraffic-mongo]    [realtraffic-redis]   [realtraffic-ddns]
#
# Guarantees:
#   • Single public URL: https://yourname.duckdns.org  (frontend + backend)
#   • No CORS, no mixed-content — everything same-origin
#   • No Vercel, no Cloudflare, no external services apart from DuckDNS
#   • All containers `realtraffic-*` prefixed → zero clash with other projects
# ──────────────────────────────────────────────────────────────────────
name: realtraffic

x-restart-policy: &default-restart
  restart: unless-stopped
  deploy:
    restart_policy:
      condition: any
      delay: 5s
      max_attempts: 0
      window: 60s

services:
  mongo:
    image: mongo:7
    container_name: realtraffic-mongo
    <<: *default-restart
    command: ["mongod", "--bind_ip_all", "--wiredTigerCacheSizeGB", "1"]
    volumes:
      - mongo-data:/data/db
    networks:
      - realtraffic-net
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1}).ok"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 2g
    memswap_limit: 2g
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

  redis:
    image: redis:7-alpine
    container_name: realtraffic-redis
    <<: *default-restart
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    volumes:
      - redis-data:/data
    networks:
      - realtraffic-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 3s
      retries: 5
    mem_limit: 384m
    memswap_limit: 384m

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: realtraffic-backend
    <<: *default-restart
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      MONGO_URL: "mongodb://mongo:27017"
      DB_NAME: "${DB_NAME:-realtraffic}"
      JWT_SECRET_KEY: "${JWT_SECRET_KEY}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:-admin@realtraffic.local}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD}"
      POSTBACK_TOKEN: "${POSTBACK_TOKEN}"
      APP_URL: "${APP_URL:-https://${BACKEND_DOMAIN}}"
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:-https://${BACKEND_DOMAIN}}"
      CORS_ORIGINS: "${CORS_ORIGINS:-*}"
      UVICORN_WORKERS: "${UVICORN_WORKERS:-4}"
      MONGO_MAX_POOL_SIZE: "${MONGO_MAX_POOL_SIZE:-150}"
      MONGO_MIN_POOL_SIZE: "${MONGO_MIN_POOL_SIZE:-20}"
      MONGO_MAX_IDLE_TIME_MS: "${MONGO_MAX_IDLE_TIME_MS:-30000}"
      HEAVY_JOB_CONCURRENCY: "${HEAVY_JOB_CONCURRENCY:-8}"
      REDIS_URL: "redis://redis:6379/0"
      RESEND_API_KEY: "${RESEND_API_KEY:-}"
      RESEND_FROM: "${RESEND_FROM:-no-reply@realtraffic.local}"
      GOOGLE_SHEETS_SA_PATH: "${GOOGLE_SHEETS_SA_PATH:-/app/backend/secrets/gsheets-sa.json}"
      GOOGLE_SHEETS_SA_JSON: "${GOOGLE_SHEETS_SA_JSON:-}"
      SENTRY_DSN: "${SENTRY_DSN:-}"
      SENTRY_ENVIRONMENT: "${SENTRY_ENVIRONMENT:-production}"
      SENTRY_RELEASE: "${SENTRY_RELEASE:-realtraffic@latest}"
      SENTRY_TRACES_SAMPLE_RATE: "${SENTRY_TRACES_SAMPLE_RATE:-0.05}"
    expose:
      - "8001"
    volumes:
      - pw-browsers:/pw-browsers
      - uploaded-data:/app/backend/uploaded_resources
      - rut-results:/app/backend/real_user_traffic_results
      - ./backend/secrets:/app/backend/secrets:ro
    networks:
      - realtraffic-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8001/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 60s
    mem_limit: 6g
    memswap_limit: 6g
    pids_limit: 2048
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Same-origin relative API calls → "" means fetch("/api/...")
        # goes to same host. Caddy routes /api/* to backend. Clean.
        REACT_APP_BACKEND_URL: ""
    container_name: realtraffic-frontend
    <<: *default-restart
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "80"
    networks:
      - realtraffic-net
    healthcheck:
      # Use wget without --spider (BusyBox wget --spider has flaky behavior
      # on some 200-OK responses).  Just fetch / and discard output.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 256m

  caddy:
    build:
      context: ./deployment/caddy
      dockerfile: Dockerfile
    image: realtraffic/caddy-rl:latest
    container_name: realtraffic-caddy
    <<: *default-restart
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        # Wait only for frontend to START — not "healthy" — to avoid
        # blocking Caddy when nginx healthcheck is flaky. Caddy's own
        # active health check will retry frontend once it's up.
        condition: service_started
      ddns-updater:
        condition: service_started
        required: false
    ports:
      # HTTP_PORT/HTTPS_PORT defaults are 80/443. INSTALL.bat auto-picks
      # alternative ports (8080/8443) if the standard ports are already
      # in use by another Docker project on the same machine.
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      BACKEND_DOMAIN: "${BACKEND_DOMAIN}"
      LE_EMAIL: "${LE_EMAIL}"
      DUCKDNS_TOKEN: "${DUCKDNS_TOKEN}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - realtraffic-net
    mem_limit: 384m
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

  ddns-updater:
    image: qmcgaw/ddns-updater:latest
    container_name: realtraffic-ddns
    <<: *default-restart
    volumes:
      - ./ddns-config:/updater/data
    environment:
      - PERIOD=5m
      - PUBLICIP_FETCHERS=ipify
    networks:
      - realtraffic-net
    mem_limit: 64m
    profiles:
      - ddns

volumes:
  mongo-data:
    name: realtraffic-mongo-data
  redis-data:
    name: realtraffic-redis-data
  pw-browsers:
    name: realtraffic-pw-browsers
  uploaded-data:
    name: realtraffic-uploaded-data
  rut-results:
    name: realtraffic-rut-results
  caddy-data:
    name: realtraffic-caddy-data
  caddy-config:
    name: realtraffic-caddy-config

networks:
  realtraffic-net:
    name: realtraffic-net
    driver: bridge
